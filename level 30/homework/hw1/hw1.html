<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Preview Card</title>
    <link rel="stylesheet" href="css1.css">
</head>
<body>
    <!-- Main container for the product card -->
    <div class="card-container">
        <!-- Product image -->
        <div class="product-image">
            <img src="image-product-desktop.jpg" alt="Product Image">
        </div>

        <!-- Product Information -->
        <div class="product-info">
            <h2 class="product-title">Awesome Product</h2>
            <p class="product-description">
                This is a short description of the product. It gives a glimpse of the product details.
            </p>
            <p class="product-price">$49.99</p>
            
            <!-- Add to cart button -->
            <button class="add-to-cart">Add to Cart</button>
        </div>
    </div>
</body>
</html>

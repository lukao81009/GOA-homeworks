<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Summary</title>
    <link rel="stylesheet" href="css2.css">
</head>
<body>
    <!-- Order Summary Card -->
    <div class="order-summary-card">
        <!-- Product Image -->
        <div class="product-image">
            <img src="Screenshot_1-1-2025_20124_.jpeg" alt="Product Image">
        </div>

        <!-- Order Details -->
        <div class="order-details">
            <h2>Order Summary</h2>
            <p class="product-name">Artwork for Your Room</p>
            <p class="product-quantity">1x Poster</p>
            <p class="product-price">$39.99</p>

            <div class="shipping-details">
                <p>Shipping: <span>$5.99</span></p>
                <p>Tax: <span>$3.99</span></p>
            </div>

            <p class="total-amount">Total: <span>$49.97</span></p>

            <button class="checkout-btn">Proceed to Payment</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>

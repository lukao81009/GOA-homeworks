<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flag Flashcards</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Flag Flashcards</h1>
    <div class="flashcards">
        <div class="card" >
            <h3>Romania</h3>
            <img src="https://th.bing.com/th/id/R.1accb4e2e04f3c6afcc7c7904c567550?rik=TwIvlMIC%2fg0SJQ&riu=http%3a%2f%2fwww.theflagman.co.uk%2fwp-content%2fuploads%2f2017%2f03%2fflag-of-Romania.jpg&ehk=x%2fdY5fqESPcKSb%2fO0mi0SMYaawDmCOQWK%2b8WfdC4Y40%3d&risl=&pid=ImgRaw&r=0" alt="Romania Flag" class="flag">
        </div>
        <div class="card">
            <h3>Niger</h3>
            <img src="https://www.worldatlas.com/img/flag/ne-flag.jpg" alt="Niger Flag" class="flag">
        </div>
        <div class="card">
            <h3>Russia</h3>
            <img src="https://th.bing.com/th/id/OIP.Z43QJ3SOOqOlt00OGv3g2AHaE8?w=5000&h=3334&rs=1&pid=ImgDetMain" alt="Russia Flag" class="flag">
        </div>
        <div class="card">
            <h3>China</h3>
            <img src="https://www.worldatlas.com/upload/a6/ee/9d/shutterstock-104282006.jpg" alt="China Flag" class="flag">
        </div>
    </div>

        <h5><p>Find more educational worksheets at kiddoworksheets.com</p></h5>
        <h5><p>Copyright @ 2021 - www.kiddoworksheets.com | All rights reserved</p></h5>
    </footer>
</body>
</html>
